<html lang="pt-BR">

    <!-- Fontes: preconnect antecipa a conexão com os servidores do Google Fonts,
         e o <link rel="stylesheet"> carrega o CSS sem bloquear o parsing da página
         (diferente do @import, que era usado antes dentro do index.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
